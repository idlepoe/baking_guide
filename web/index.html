<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="광고없는제과제빵실기 - 제빵기능사 실기 준비를 위한 무료·무광고 연습 가이드 앱" />
  <title>광고없는제과제빵실기</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #5b6470;
      --primary: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 2vw, 2rem);
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .section {
      margin-top: 18px;
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }
    ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }
    li { margin-bottom: 6px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }
    .btn.primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }
    .foot {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="badge">무료 · 무광고</span>
      <h1>광고없는제과제빵실기</h1>
      <p class="subtitle">제빵기능사 실기를 앱 하나로 연습하는 실전 가이드</p>

      <p>
        교재, 타이머, 계산기를 오가며 연습하던 흐름을 하나로 묶었습니다.
        품목별 단계 안내와 타이머, 반죽 온도 계산, 핵심노트를 통해 실기 연습에 집중할 수 있습니다.
      </p>

      <div class="section">
        <h2>주요 기능</h2>
        <ul>
          <li>품목별 실기 레시피와 단계별 체크리스트</li>
          <li>발효·굽기·시험 시간 타이머 및 진행 상태 관리</li>
          <li>반죽 온도(물온도) 계산기</li>
          <li>핵심노트(공정 흐름/플래시카드/주의 포인트)</li>
        </ul>
      </div>

      <div class="actions">
        <a class="btn primary" href="/etc/policy.html">개인정보처리방침</a>
        <a class="btn" href="mailto:idlepoe@gmail.com">문의하기</a>
      </div>

      <p class="foot">개발자: 황금풍뎅이</p>
    </section>
  </main>
</body>
</html>
